<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Online Learning Academy Registration Form. Enroll in our courses and start your learning journey with us!" />
    <meta name="keywords" content="Online Learning, Academy, Registration Form, Courses, Enrollment" />
    <meta name="author" content="Rohit Jain" />
    <title>Online Learning Academy</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
      <h1>Welcome to the Online Learning Academy</h1>
      <p>
        Your gateway to knowledge and skill development. Explore our courses and
        start learning today!
      </p>
    </header>
    <main>
        <section>
            <fieldset>
                <form>
                <legend>Personal Information</legend>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" required><br><br>

                <label for="course">Course Interested In:</label><br>
                <select name="course" id="course" required>
                    <option value="">Select a course</option>
                    <option value="web-development">Web Development</option>
                    <option value="data-science">Data Science</option>
                    <option value="graphic-design">Graphic Design</option>
                    <option value="digital-marketing">Digital Marketing</option>
                    <option value="MERN Stack">MERN Stack</option>
                    <option value="Java Full stack">Java Full stack</option>
                </select>
                <br><br>

                <label for="batch">Preferred Batch:</label><br>
                <select name="batch" required>
                    <option value="">Select a batch</option>
                    <option value="morning">Morning</option>
                    <option value="evening">Evening</option>
                </select>
                <br><br>
                <input type="submit" value="Submit">
                </form>

            </fieldset>
        </section>
      <section>
        <h2>Course Introduction</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/1X8ZPyxpL0s?si=JU8mVZN2joIkxqkq" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </section>
      <section>
        <h2>Academy Theme Song</h2>
        <audio controls>
          <source
            src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            type="audio/mpeg"
          />
          Your browser does not support the audio element.
        </audio>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Global Tech Conference. All rights reserved.</p>
    </footer>
  </body>
</html>
