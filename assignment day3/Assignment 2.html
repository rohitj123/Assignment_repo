<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Online Appointment Booking Form for a clinic. Book your appointment with our doctors easily through this form." />
    <meta name="keywords" content="Online Appointment, Booking Form, Clinic, Doctors, Medical Appointment" />
    <meta name="author" content="Rohit Jain" />
    <title>Online Appointment</title>
  </head>
  <body>
    <h1>Online Appointment Booking Form</h1>
    <header>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
      <h2>Welcome to Our Clinic</h2>
      <p>
        Please fill out the form below to book your appointment with our
        doctors.
      </p>
    </header>
    <main>
      <section>
        <fieldset>
          <legend>Online Appointment Booking</legend>
          <form>
            <label for="Patient name">Patient Name:</label>
            <input
              type="text"
              id="Patient name"
              name="Patient name"
            /><br /><br />
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" /><br /><br />
            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male" />
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" />
            <label for="female">Female</label><br /><br />
            <label for="Contact No:">Contact No:</label>
            <input
              type="tel"
              id="Contact No:"
              name="Contact No:"
              maxlength="10"
            /><br /><br />
            <label for="Address">Address:</label>
            <textarea id="Address" name="Address" rows="4" cols="50"></textarea
            ><br /><br />
            <label for="doctor name">Doctor Name:</label>
            <select id="doctor name" name="doctor name">
              <option value="Dr. Smith">Dr. Smith</option>
              <option value="Dr. Johnson">Dr. Johnson</option>
              <option value="Dr. Lee">Dr. Lee</option></select
            ><br /><br />
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" /><br /><br />
            <input type="submit" value="Book Appointment" />
          </form>
        </fieldset>
      </section>
      <aside>
        <h2>Clinic Introduction</h2>
        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/c5-uXuaWPOo?si=ws53a4fVQWEvUq5Q"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </aside>
      <aside>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14199.746060896015!2d78.38078366977538!3d27.158287600000023!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x397446aa1c973193%3A0x4982d0a3f3577170!2sS%20N%20M%20Hospital%20%26%20T%20B%20Sanatorium!5e0!3m2!1sen!2sin!4v1780832947630!5m2!1sen!2sin"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </aside>
    </main>
    <footer>
      <p>&copy; 2026 Global Tech Conference. All rights reserved.</p>
    </footer>
  </body>
</html>
