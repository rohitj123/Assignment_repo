        *{
            margin: 0;
            box-sizing: border-box;
        }
        #container{
            width: 100%;
            height: 100vh;
            background-color: rgb(232, 238, 238);
            
            text-align: center;
            padding-top: 20px;
        }
        #container>h3{
            color: rgb(59, 58, 58);
        }
        .big-box{
            width: 100%;
            
            height: 300px;
            
        }
        .box{
            display: grid;
            grid-template-columns: repeat(8, 100px);
            grid-template-rows: repeat(2, 100px);
            justify-content: center;
            margin-top: 20px;
            gap: 20px;
            align-items: center;
            
        }
        .box>div{
            box-shadow: 5px 5px 17px -7px #000000;
            border-radius: 10px;
        }
        img{
            width: 80px;
            height: 80px;
            mix-blend-mode:multiply;
            background-color: #fff;
            border-radius: 10px;
            
        }
        button{
            height:40px ;
            border-radius: 10px;
            border:2px solid red;
            color: red;
            background-color: #fff;
        }
    </style>
