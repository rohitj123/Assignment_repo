    <title>Problem 1</title>
    <style>
        *{
            margin: 0px;
        }
      #container {
        width: 100%;
        height: 1000px;
        display: flex;
        justify-content: center;
        height: 500px;
        align-items: center;
        background-color: rgb(38, 164, 184);
      }
      .box {
        display: grid;
        grid-template-columns: repeat(12, 90px);
        grid-template-rows: repeat(5, 60px);
        padding: 35px;
        border-radius: 10px;
        background-color: rgba(48, 47, 47, 0.938);
      }

      .box > div {
        margin: 5px;
        justify-content: center;
        align-items: center;
        display: flex;
        font-weight: bolder;
        font-size: 18px;
        color: aqua;
        background-color: rgba(42, 42, 42, 0.899);
        box-shadow: 5px 5px 17px -7px #000000;
      }
      .box > div:nth-child(35) {
        grid-area: 3/11/4/13;
      }
      .box > div:nth-child(46) {
        grid-area: 4/11/5/13;
      }
      .box > div:nth-child(51) {
        grid-area: 5/5/6/9;
      }
      img{
        height: 40px;
        mix-blend-mode:color;
        
      }
    </style>
